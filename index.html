<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>de Streel Household Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17332B">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --paper: #F1EEE1;
    --paper-shade: #E7E2D0;
    --ink: #22261F;
    --ink-soft: #6C6F5F;
    --rule: #D6CFB4;
    --cover: #17332B;
    --cover-light: #24483C;
    --accent: #3D7A5E;
    --accent-ink: #F1EEE1;
    --credit: #2F7A52;
    --debit: #9C4A3C;
    --danger-hover: #7A2F24;
    --shadow: rgba(23, 51, 43, 0.18);
    --credit-strip: #8FEAB8;
    --debit-strip: #FFA98A;
    --series-income: #2a78d6;
    --series-expense: #eb6834;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16180F;
      --paper-shade: #1E2116;
      --ink: #ECE7D6;
      --ink-soft: #9B9884;
      --rule: #383C2C;
      --cover: #101E17;
      --cover-light: #1D4536;
      --accent: #5FC08A;
      --accent-ink: #0E1A13;
      --credit: #6FCE9E;
      --debit: #E28468;
      --danger-hover: #F0A48D;
      --shadow: rgba(0, 0, 0, 0.45);
      --series-income: #3987e5;
      --series-expense: #d95926;
    }
  }

  :root[data-theme="dark"] {
    --paper: #16180F;
    --paper-shade: #1E2116;
    --ink: #ECE7D6;
    --ink-soft: #9B9884;
    --rule: #383C2C;
    --cover: #101E17;
    --cover-light: #1D4536;
    --accent: #5FC08A;
    --accent-ink: #0E1A13;
    --credit: #6FCE9E;
    --debit: #E28468;
    --danger-hover: #F0A48D;
    --shadow: rgba(0, 0, 0, 0.45);
    --series-income: #3987e5;
    --series-expense: #d95926;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { color-scheme: light dark; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding-inline: 16px;
    padding-block: 32px;
  }

  .sheet {
    max-width: 640px;
    margin: 0 auto;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 18px 40px -20px var(--shadow), 0 2px 0 var(--rule);
    border: 1px solid var(--rule);
  }

  .masthead {
    background: var(--cover);
    color: var(--paper);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px 12px;
  }

  .masthead h1 {
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.3rem;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  .month-bar {
    background: var(--cover);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 14px 14px;
    flex-wrap: wrap;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .month-nav button.arrow {
    all: unset;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--paper);
    opacity: 0.85;
  }
  .month-nav button.arrow:hover { background: rgba(241, 238, 225, 0.14); opacity: 1; }
  .month-nav button.arrow:focus-visible { outline: 2px solid var(--credit); }

  .month-label {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 0 4px;
    min-width: 168px;
    text-align: center;
  }

  .today-btn {
    all: unset;
    box-sizing: border-box;
    font-size: 0.72rem;
    color: var(--credit);
    cursor: pointer;
    padding: 3px 8px;
    border: 1px solid rgba(111, 206, 158, 0.45);
    border-radius: 20px;
    margin-left: 6px;
  }
  .today-btn:focus-visible { outline: 2px solid var(--credit); }

  .current-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--paper);
    opacity: 0.6;
    white-space: nowrap;
    margin-left: 4px;
  }

  .summary-strip {
    display: flex;
    flex-wrap: wrap;
    background: var(--cover-light);
    border-top: 1px solid rgba(0, 0, 0, 0.12);
  }

  .stat {
    flex: 1 1 120px;
    padding: 10px 16px;
    border-left: 1px solid rgba(241, 238, 225, 0.14);
  }
  .stat:first-child { border-left: none; }

  .stat .label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--paper);
    opacity: 0.92;
  }

  .stat .value {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .stat.credit .value { color: var(--credit-strip); }
  .stat.debit .value { color: var(--debit-strip); }
  .stat.net .value { color: var(--paper); }
  .stat.net.negative .value { color: var(--debit); }

  .sync-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 16px;
    background: var(--paper-shade);
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
  }
  .sync-status {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--ink-soft);
  }
  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-soft);
    flex-shrink: 0;
  }
  .sync-dot.connected { background: var(--credit); }
  .sync-dot.error { background: var(--debit); }
  .sync-actions { display: flex; align-items: center; gap: 10px; }
  .sync-btn {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    color: var(--accent);
    font-weight: 500;
    font-size: 0.76rem;
    padding: 4px 11px;
    border: 1px solid var(--accent);
    border-radius: 20px;
  }
  .sync-btn:hover { background: var(--accent); color: var(--accent-ink); }
  .sync-btn:focus-visible { outline: 2px solid var(--accent); }
  .sync-link {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    color: var(--ink-soft);
    text-decoration: underline;
    font-size: 0.74rem;
  }

  .share-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 16px;
    background: var(--paper-shade);
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
  }
  .share-row input {
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 5px 8px;
    flex: 1;
    min-width: 160px;
  }
  .share-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .share-msg { color: var(--ink-soft); font-size: 0.76rem; }

  .load-error {
    font-size: 0.8rem;
    padding: 8px 20px;
    background: color-mix(in srgb, var(--debit) 18%, var(--paper));
    color: var(--debit);
  }

  .body-scroll {
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 30px,
      var(--rule) 30px,
      var(--rule) 31px
    );
    background-color: var(--paper);
    padding: 18px 10px 6px;
  }

  .loading-row {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .section-label {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    padding: 3px 4px 8px;
    background: var(--paper);
    position: relative;
  }

  .section { margin-bottom: 20px; }

  .group {
    margin-bottom: 14px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--paper);
  }

  .group-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 9px 14px;
    background: var(--cover-light);
    color: var(--paper);
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1rem;
  }
  .group-header .amt {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.88rem;
    opacity: 0.9;
  }

  .cat { border-top: 1px solid var(--rule); }
  .cat:first-child { border-top: none; }

  .cat-header {
    all: unset;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 9px 14px;
    cursor: pointer;
    color: var(--ink);
    font-size: 0.92rem;
  }
  .cat-header { position: relative; }
  .cat-header:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cat-header .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cat-header .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-header .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .cat-header .amt {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    color: var(--ink-soft);
    flex-shrink: 0;
    padding-left: 8px;
  }
  .cat-header[data-hastotal="true"][data-tone="debit"] .amt { color: var(--debit); }
  .cat-header[data-hastotal="true"][data-tone="credit"] .amt { color: var(--credit); }

  .budget-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
    flex-basis: 100%;
    padding-left: 23px;
    white-space: nowrap;
  }
  .cat-header.has-budget { padding-bottom: 13px; }
  .cat-header.has-budget .left { flex-wrap: wrap; row-gap: 1px; }
  .budget-note.over { color: var(--debit); font-weight: 600; }
  .budget-bar {
    position: absolute;
    left: 14px; right: 14px; bottom: 2px;
    height: 3px;
    border-radius: 2px;
    background: var(--rule);
    overflow: hidden;
    pointer-events: none;
  }
  .budget-bar > span { display: block; height: 100%; background: var(--accent); }
  .budget-bar.over > span { background: var(--debit); }

  .budget-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px 8px 34px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .budget-row .budget-label { flex: 1; min-width: 0; }
  .budget-row .budget-amt { font-family: 'IBM Plex Mono', monospace; color: var(--ink); font-weight: 600; }
  .budget-form input[name="budget"] { width: 110px; text-align: right; }

  .chevron { flex-shrink: 0; color: var(--ink-soft); display: flex; }
  .cat-panel { background: var(--paper-shade); }

  .purchase-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 14px 7px 34px;
    border-top: 1px solid var(--rule);
    font-size: 0.88rem;
  }
  .purchase-row.flush { padding-left: 14px; }
  .purchase-row .date {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .purchase-row .cat-tag {
    font-size: 0.72rem;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 20px;
    padding: 1px 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .purchase-row .desc {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .purchase-row .amt {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .purchase-row[data-tone="debit"] .amt { color: var(--debit); }
  .purchase-row[data-tone="credit"] .amt { color: var(--credit); }
  .purchase-row .del {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex;
    padding: 2px;
    border-radius: 4px;
  }
  .purchase-row .del:hover { color: var(--danger-hover); }
  .purchase-row .del:focus-visible { outline: 2px solid var(--accent); }
  .purchase-row .edit-btn {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex;
    padding: 2px;
    border-radius: 4px;
  }
  .purchase-row .edit-btn:hover { color: var(--accent); }
  .purchase-row .edit-btn:focus-visible { outline: 2px solid var(--accent); }
  .recur-badge {
    display: inline-flex;
    vertical-align: middle;
    color: var(--ink-soft);
    opacity: 0.8;
  }
  .purchase-row .stop-recur {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex;
    padding: 2px;
    border-radius: 4px;
  }
  .purchase-row .stop-recur:hover { color: var(--accent); }
  .purchase-row .stop-recur:focus-visible { outline: 2px solid var(--accent); }

  .add-toggle {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px 9px 34px;
    color: var(--accent);
    font-size: 0.88rem;
    cursor: pointer;
    border-top: 1px dashed var(--rule);
  }
  .add-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .add-form {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 9px 14px 9px 34px;
    border-top: 1px dashed var(--rule);
  }
  .add-form input {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 5px 8px;
  }
  .add-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .add-form input[type="date"], .add-form input[type="number"] { font-family: 'IBM Plex Mono', monospace; }
  .add-form input[name="date"] { width: 132px; }
  .add-form input[name="description"] { flex: 1; min-width: 110px; }
  .add-form input[name="amount"] { width: 88px; text-align: right; }
  .add-form button[type="submit"] {
    all: unset;
    box-sizing: border-box;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .add-form .cancel {
    all: unset;
    box-sizing: border-box;
    color: var(--ink-soft);
    font-size: 0.82rem;
    cursor: pointer;
    padding: 4px;
  }
  .recur-check {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .recur-check input { width: auto; }

  .cc-panel { padding: 10px 14px 10px 34px; border-bottom: 1px solid var(--rule); }
  .cc-summary { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 8px; }
  .cc-summary-label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-soft);
  }
  .cc-summary-value {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
  }
  .cc-status {
    font-size: 0.8rem;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 5px;
    margin-bottom: 8px;
    display: inline-block;
  }
  .cc-status.short { background: rgba(156, 74, 60, 0.14); color: var(--debit); }
  .cc-status.ok { background: rgba(47, 122, 82, 0.14); color: var(--credit); }
  .cc-list { margin-bottom: 4px; }
  .cc-row {
    padding: 6px 0;
    border-top: 1px dashed var(--rule);
    font-size: 0.85rem;
  }
  .cc-row:first-child { border-top: none; }
  .cc-row-top { display: flex; align-items: center; gap: 8px; }
  .cc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .cc-row-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-top: 2px;
  }
  .cc-autopay-badge {
    font-family: 'Inter', sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: rgba(61, 122, 94, 0.12);
    border-radius: 20px;
    padding: 1px 7px;
  }
  .cc-panel .add-toggle, .cc-panel .add-form { padding-left: 0; }
  .cc-form input[name="name"] { flex: 1; min-width: 110px; }
  .cc-form input[name="balance"], .cc-form input[name="minPayment"] { width: 110px; text-align: right; }
  .cc-row .del, .cc-row .edit-btn {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex;
    padding: 2px;
    border-radius: 4px;
  }
  .cc-row .del:hover { color: var(--danger-hover); }
  .cc-row .edit-btn:hover { color: var(--accent); }
  .cc-row .del:focus-visible, .cc-row .edit-btn:focus-visible { outline: 2px solid var(--accent); }

  .empty-note { padding: 14px; color: var(--ink-soft); font-size: 0.85rem; text-align: center; }

  .export-btn {
    all: unset;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.22);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .export-btn:hover { background: rgba(0, 0, 0, 0.32); }
  .export-btn:focus-visible { outline: 2px solid var(--credit); }

  .export-menu { position: relative; }
  .export-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 5;
    background: var(--cover);
    border: 1px solid rgba(241, 238, 225, 0.18);
    border-radius: 10px;
    box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.5);
    padding: 4px;
    min-width: 190px;
    white-space: nowrap;
  }
  .export-dropdown button {
    all: unset;
    box-sizing: border-box;
    display: block;
    width: 100%;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .export-dropdown button:hover, .export-dropdown button:focus-visible { background: rgba(241, 238, 225, 0.12); }

  .footer { padding: 14px 12px 4px; text-align: center; }
  .footer button {
    all: unset;
    box-sizing: border-box;
    color: var(--ink-soft);
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 8px;
  }
  .footer button:hover { color: var(--debit); }
  .footer button:focus-visible { outline: 2px solid var(--accent); border-radius: 3px; }
  .footer button[data-action="open-audit"]:hover { color: var(--accent); }

  .audit-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 15, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .audit-card {
    background: var(--paper);
    color: var(--ink);
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.5);
  }
  .audit-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--cover);

  document.querySelector('[data-action="prev-month"]').innerHTML = ICONS.chevronLeft;
  document.querySelector('[data-action="next-month"]').innerHTML = ICONS.chevronRight;

  function ledgerData(ledgerKey) { return state.data[ledgerKey] || {}; }

  function monthList(ledgerKey, cat) {
    var list = ledgerData(ledgerKey)[cat] || [];
    return list.filter(function (p) { return inSelectedMonth(p.date); });
  }

  function categoryTotal(ledgerKey, cat) {
    var list = monthList(ledgerKey, cat);
    var sum = 0;
    for (var i = 0; i < list.length; i++) sum += Number(list[i].amount) || 0;
    return sum;
  }

  function groupTotal(ledgerKey, group) {
    var sum = 0;
    for (var i = 0; i < group.categories.length; i++) sum += categoryTotal(ledgerKey, group.categories[i]);
    return sum;
  }

  function ledgerTotal(ledgerKey) {
    var data = ledgerData(ledgerKey);
    var sum = 0;
    for (var cat in data) sum += categoryTotal(ledgerKey, cat);
    return sum;
  }

  function renderPurchaseRow(ledger, cat, p, opts) {
    opts = opts || {};
    var showCat = !!opts.showCat;
    var recurBadge = p.seriesId ? ' <span class="recur-badge" title="Repeats monthly on day ' + p.recurDay + '">' + ICONS.repeat + '</span>' : '';
    return (
      '<div class="purchase-row' + (opts.flush ? ' flush' : '') + '" data-tone="' + ledger.tone + '">' +
        (showCat ? '' : '<span class="date">' + escapeHtml(formatDate(p.date)) + '</span>') +
        (showCat ? '<span class="cat-tag">' + escapeHtml(cat) + '</span>' : '') +
        '<span class="desc">' + escapeHtml(p.description) + recurBadge + '</span>' +
        '<span class="amt">$' + formatMoney(p.amount) + '</span>' +
        (p.seriesId ? '<button type="button" class="stop-recur" data-action="stop-recur" data-ledger="' + ledger.key + '" data-cat="' + escapeHtml(cat) + '" data-series="' + escapeHtml(p.seriesId) + '" title="Stop repeating monthly">' + ICONS.repeatOff + '</button>' : '') +
        '<button type="button" class="edit-btn" data-action="edit-entry" data-ledger="' + ledger.key + '" data-cat="' + escapeHtml(cat) + '" data-id="' + escapeHtml(p.id) + '" aria-label="Edit entry">' + ICONS.pencil + '</button>' +
        '<button type="button" class="del" data-action="delete-entry" data-ledger="' + ledger.key + '" data-cat="' + escapeHtml(cat) + '" data-id="' + escapeHtml(p.id) + '" aria-label="' + escapeHtml(ledger.deleteLabel) + '">' + ICONS.trash + '</button>' +
      '</div>'
    );
  }

  function renderEditForm(ledger, cat, p) {
    return (
      '<form class="add-form" data-ledger="' + ledger.key + '" data-cat="' + escapeHtml(cat) + '" data-id="' + escapeHtml(p.id) + '" data-role="edit-form">' +
        '<input type="date" name="date" value="' + escapeHtml(p.date) + '" required>' +
        '<input type="text" name="description" value="' + escapeHtml(p.description) + '" autocomplete="off" required>' +
        '<input type="number" name="amount" step="0.01" min="0.01" value="' + escapeHtml(p.amount) + '" required>' +
        '<button type="submit">Save</button>' +
        '<button type="button" class="cancel" data-action="cancel-edit">Cancel</button>' +
      '</form>'
    );
  }

  function renderAddForm(ledger, cat) {
    var recurField = RECUR_CATEGORIES[cat]
      ? '<label class="recur-check"><input type="checkbox" name="recurring"> Repeats monthly</label>'
      : '';
    return (
      '<form class="add-form" data-ledger="' + ledger.key + '" data-cat="' + escapeHtml(cat) + '" data-role="add-form">' +
        '<input type="date" name="date" value="' + defaultEntryDate() + '" required>' +
        '<input type="text" name="description" placeholder="Description" autocomplete="off" required>' +
        '<input type="number" name="amount" step="0.01" min="0.01" placeholder="0.00" required>' +
        recurField +
        '<button type="submit">Add</button>' +
        '<button type="button" class="cancel" data-action="cancel-add" data-ledger="' + ledger.key + '" data-cat="' + escapeHtml(cat) + '">Cancel</button>' +
      '</form>'
    );
  }

  function renderCardRow(card) {
    var autopayBadge = card.autopay ? ' <span class="cc-autopay-badge">Autopay</span>' : '';
    return (
      '<div class="cc-row">' +
        '<div class="cc-row-top">' +
          '<span class="cc-name">' + escapeHtml(card.name) + '</span>' +
          '<button type="button" class="edit-btn" data-action="edit-card" data-id="' + escapeHtml(card.id) + '" aria-label="Edit account">' + ICONS.pencil + '</button>' +
          '<button type="button" class="del" data-action="delete-card" data-id="' + escapeHtml(card.id) + '" aria-label="Delete account">' + ICONS.trash + '</button>' +
        '</div>' +
        '<div class="cc-row-meta">Balance $' + formatMoney(card.balance) + ' &middot; Min $' + formatMoney(card.minPayment) + autopayBadge + '</div>' +
      '</div>'
    );
  }

  function renderCardForm(role, card) {
    card = card || { id: "", name: "", balance: "", minPayment: "", autopay: false };
    return (
      '<form class="add-form cc-form" data-role="' + role + '" data-id="' + escapeHtml(card.id) + '">' +
        '<input type="text" name="name" placeholder="Account name" value="' + escapeHtml(card.name) + '" autocomplete="off" required>' +
        '<input type="number" name="balance" step="0.01" min="0" placeholder="Balance" value="' + escapeHtml(card.balance) + '" required>' +
        '<input type="number" name="minPayment" step="0.01" min="0" placeholder="Min payment" value="' + escapeHtml(card.minPayment) + '" required>' +
        '<label class="recur-check"><input type="checkbox" name="autopay"' + (card.autopay ? " checked" : "") + '> Autopay</label>' +
        '<button type="submit">' + (role === "edit-card-form" ? "Save" : "Add") + '</button>' +
        '<button type="button" class="cancel" data-action="' + (role === "edit-card-form" ? "cancel-edit-card" : "cancel-add-card") + '">Cancel</button>' +
      '</form>'
    );
  }

  function renderCreditCardsPanel(cat, paidThisMonth) {
    var cards = creditCardsFor(cat);
    var totalBalance = 0, totalMinPayment = 0, manualMinPayment = 0;
    for (var i = 0; i < cards.length; i++) {
      totalBalance += Number(cards[i].balance) || 0;
      totalMinPayment += Number(cards[i].minPayment) || 0;
      if (!cards[i].autopay) manualMinPayment += Number(cards[i].minPayment) || 0;
    }
    var html = '<div class="cc-panel">';
    html += '<div class="cc-summary">';
    html += '<div><span class="cc-summary-label">Total balance due</span><span class="cc-summary-value">$' + formatMoney(totalBalance) + '</span></div>';
    html += '<div><span class="cc-summary-label">Minimum due this month</span><span class="cc-summary-value">$' + formatMoney(totalMinPayment) + '</span></div>';
    html += '</div>';
    if (cards.length && manualMinPayment > 0) {
      var shortfall = manualMinPayment - paidThisMonth;
      html += shortfall > 0.004
        ? '<div class="cc-status short">$' + formatMoney(shortfall) + ' short of this month\'s minimum payments not on autopay</div>'
        : '<div class="cc-status ok">Minimum payments covered this month</div>';
    }
    if (cards.length) {
      html += '<div class="cc-list">';
      for (var j = 0; j < cards.length; j++) {
        html += editingCardId === cards[j].id ? renderCardForm("edit-card-form", cards[j]) : renderCardRow(cards[j]);
      }
      html += '</div>';
    }
    html += addingCard
      ? renderCardForm("add-card-form")
      : '<button type="button" class="add-toggle" data-action="show-add-card">' + ICONS.plus + ' Add account</button>';
    html += '</div>';
    return html;
  }

  function budgetFor(ledger, cat) {
    if (ledger.key !== "expenses") return 0;
    var b = Number(state.data.budgets && state.data.budgets[cat]);
    return b > 0 ? b : 0;
  }

  function renderBudgetRow(cat, spent, budget) {
    if (editingBudgetCat === cat) {
      return (
        '<form class="add-form budget-form" data-role="budget-form" data-cat="' + escapeHtml(cat) + '">' +
          '<input type="number" name="budget" step="0.01" min="0.01" placeholder="Monthly budget" value="' + (budget ? escapeHtml(budget) : '') + '" required>' +
          '<button type="submit">Save</button>' +
          (budget ? '<button type="button" class="cancel" data-action="clear-budget" data-cat="' + escapeHtml(cat) + '">Remove</button>' : '') +
          '<button type="button" class="cancel" data-action="cancel-budget">Cancel</button>' +
        '</form>'
      );
    }
    if (!budget) {
      return '<button type="button" class="add-toggle" data-action="edit-budget" data-cat="' + escapeHtml(cat) + '">' + ICONS.plus + ' Set monthly budget</button>';
    }
    var left = budget - spent;
    return (
      '<div class="budget-row">' +
        '<span class="budget-label">Monthly budget <span class="budget-amt">$' + formatMoney(budget) + '</span> &middot; ' +
          (left < 0 ? '$' + formatMoney(-left) + ' over' : '$' + formatMoney(left) + ' left') + '</span>' +
        '<button type="button" class="edit-btn" data-action="edit-budget" data-cat="' + escapeHtml(cat) + '" aria-label="Edit budget">' + ICONS.pencil + '</button>' +
      '</div>'
    );
  }

  function renderCategory(ledger, cat) {
    var list = monthList(ledger.key, cat);
    var isOpen = openCategory && openCategory.ledger === ledger.key && openCategory.cat === cat;
    var isAdding = addingCategory && addingCategory.ledger === ledger.key && addingCategory.cat === cat;
    var total = categoryTotal(ledger.key, cat);
    var budget = budgetFor(ledger, cat);
    var html = '<div class="cat">';
    html += '<button type="button" class="cat-header' + (budget ? ' has-budget' : '') + '" data-action="toggle-category" data-ledger="' + ledger.key + '" data-cat="' + escapeHtml(cat) + '" data-tone="' + ledger.tone + '" data-hastotal="' + (total > 0 ? "true" : "false") + '">';
    html += '<span class="left"><span class="chevron">' + (isOpen ? ICONS.chevronDown : ICONS.chevronRight) + '</span>';
    html += '<span class="name">' + escapeHtml(cat) + '</span>';
    if (list.length) html += '<span class="count">(' + list.length + ')</span>';
    if (budget) {
      var over = total > budget + 0.004;
      html += '<span class="budget-note' + (over ? ' over' : '') + '">' + (over ? '$' + formatMoney(total - budget) + ' over' : '$' + formatMoney(budget - total) + ' left') + '</span>';
    }
    html += '</span>';
    html += '<span class="amt">$' + formatMoney(total) + '</span>';
    if (budget) {
      html += '<span class="budget-bar' + (total > budget + 0.004 ? ' over' : '') + '" aria-hidden="true"><span style="width:' + Math.min(100, total / budget * 100).toFixed(1) + '%"></span></span>';
    }
    html += '</button>';

    if (isOpen) {
      html += '<div class="cat-panel">';
      if (ledger.key === "expenses") html += renderBudgetRow(cat, total, budget);
      if (categoryGroupName(ledger, cat) === DEBT_GROUP_NAME) html += renderCreditCardsPanel(cat, total);
      for (var i = 0; i < list.length; i++) {
        var isEditing = editingEntry && editingEntry.ledger === ledger.key && editingEntry.cat === cat && editingEntry.id === list[i].id;
        html += isEditing ? renderEditForm(ledger, cat, list[i]) : renderPurchaseRow(ledger, cat, list[i]);
      }
      if (isAdding) {
        html += renderAddForm(ledger, cat);
      } else {
        html += '<button type="button" class="add-toggle" data-action="show-add" data-ledger="' + ledger.key + '" data-cat="' + escapeHtml(cat) + '">' + ICONS.plus + ' ' + escapeHtml(ledger.addLabel) + '</button>';
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderGroup(ledger, group) {
    var html = '<div class="group">';
    if (group.name) {
      html += '<div class="group-header"><span>' + escapeHtml(group.name) + '</span><span class="amt">$' + formatMoney(groupTotal(ledger.key, group)) + '</span></div>';
    }
    for (var i = 0; i < group.categories.length; i++) html += renderCategory(ledger, group.categories[i]);
    html += '</div>';
    return html;
  }

  function renderLedgerSection(ledger) {
    var html = '<div class="section">';
    html += '<div class="section-label">' + escapeHtml(ledger.sectionLabel) + '</div>';
    for (var i = 0; i < ledger.groups.length; i++) html += renderGroup(ledger, ledger.groups[i]);
    html += '</div>';
    return html;
  }

  function renderListView() {
    var html = "";
    for (var i = 0; i < LEDGERS.length; i++) html += renderLedgerSection(LEDGERS[i]);
    return html;
  }

  function daysInSelectedMonth() { return new Date(selectedYear, selectedMonth + 1, 0).getDate(); }

  // ---------- CSV export ----------

  function csvField(value) {
    var s = value === null || value === undefined ? "" : String(value);
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function categoryGroupName(ledger, cat) {
    for (var i = 0; i < ledger.groups.length; i++) {
      if (ledger.groups[i].categories.indexOf(cat) !== -1) return ledger.groups[i].name || "";
    }
    return "";
  }

  function buildCsv(monthOnly) {
    var rows = [];
    LEDGERS.forEach(function (ledger) {
      var data = ledgerData(ledger.key);
      for (var cat in data) {
        (data[cat] || []).forEach(function (p) {
          if (monthOnly && !inSelectedMonth(p.date)) return;
          rows.push({
            date: p.date,
            ledger: ledger.sectionLabel,
            group: categoryGroupName(ledger, cat),
            category: cat,
            description: p.description,
            amount: Number(p.amount) || 0,
            recurring: p.seriesId ? "Yes" : "No"
          });
        });
      }
    });
    rows.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var lines = [["Date", "Ledger", "Group", "Category", "Description", "Amount", "Recurring"].join(",")];
    rows.forEach(function (r) {
      lines.push([
        csvField(r.date), csvField(r.ledger), csvField(r.group), csvField(r.category),
        csvField(r.description), csvField(r.amount.toFixed(2)), csvField(r.recurring)
      ].join(","));
    });
    return lines.join("\r\n");
  }

  function downloadCsv(csv, filename) {
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportCsv() {
    var filename = "household-ledger-" + selectedYear + "-" + pad2(selectedMonth + 1) + ".csv";
    downloadCsv(buildCsv(true), filename);
  }

  function exportAllCsv() {
    downloadCsv(buildCsv(false), "household-ledger-all-" + todayISO() + ".csv");
  }

  function buildAuditCsv() {
    var lines = [["Timestamp", "User", "Action", "Ledger", "Category", "Description", "Amount", "Date", "Previous Description", "Previous Amount", "Previous Date"].join(",")];
    auditLog.forEach(function (e) {
      var prev = e.previous || {};
      lines.push([
        csvField(formatTimestamp(e.ts)), csvField(e.user), csvField(e.action),
        csvField(e.ledger === "income" ? "Income" : "Expenses"), csvField(e.category), csvField(e.description),
        csvField((Number(e.amount) || 0).toFixed(2)), csvField(e.date),
        csvField(prev.description || ""), csvField(prev.amount !== undefined ? Number(prev.amount).toFixed(2) : ""), csvField(prev.date || "")
      ].join(","));
    });
    return lines.join("\r\n");
  }

  async function exportAuditLog() {
    if (drive.status === "connected" || drive.status === "syncing") {
      try {
        var data = await readDriveJson(drive.auditFileId);
        auditLog = (data && data.entries) || [];
      } catch (e) { /* export whatever is already cached */ }
    }
    downloadCsv(buildAuditCsv(), "household-ledger-audit-" + todayISO() + ".csv");
  }

  // ---------- Reports (budget vs actual, trends) ----------

  var SHORT_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function money0(n) { return "$" + Math.round(n).toLocaleString("en-US"); }

  function expenseCategories() {
    var out = [];
    LEDGERS.forEach(function (l) {
      if (l.key !== "expenses") return;
      l.groups.forEach(function (g) { g.categories.forEach(function (c) { out.push({ cat: c, group: g.name }); }); });
    });
    return out;
  }

  // The n months ending at the currently selected month, oldest first.
  function reportMonthKeys(n) {
    var out = [];
    var y = selectedYear, m = selectedMonth;
    for (var i = 0; i < n; i++) {
      out.unshift({ y: y, m: m, key: monthKeyOf(y, m) });
      m -= 1;
      if (m < 0) { m = 11; y -= 1; }
    }
    return out;
  }

  // One pass over all entries -> { income: {key: total}, expenses: {key: total}, byCat: {cat: {key: total}} }
  function collectMonthly() {
    var res = { income: {}, expenses: {}, byCat: {} };
    LEDGERS.forEach(function (ledger) {
      var data = ledgerData(ledger.key);
      for (var cat in data) {
        (data[cat] || []).forEach(function (p) {
          var key = String(p.date || "").slice(0, 7);
          var amt = Number(p.amount) || 0;
          res[ledger.key][key] = (res[ledger.key][key] || 0) + amt;
          if (ledger.key === "expenses") {
            res.byCat[cat] = res.byCat[cat] || {};
            res.byCat[cat][key] = (res.byCat[cat][key] || 0) + amt;
          }
        });
      }
    });
    return res;
  }

  function niceScale(max) {
    if (!(max > 0)) return { max: 100, step: 25 };
    var raw = max / 4;
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var norm = raw / mag;
    var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    return { max: Math.ceil(max / step) * step, step: step };
  }

  function roundedTopBar(x, y, w, h) {
    x = Number(x); y = Number(y);
    if (h <= 0) return "";
    var r = Math.min(4, w / 2, h);
    return '<path d="M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
      'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z"';
  }

  // Grouped columns. series: [{name, color, values}], opts.budget draws a reference line.
  function renderColumns(chartId, width, labels, series, opts) {
    opts = opts || {};
    var H = 200, mL = 50, mR = 8, mT = 10, mB = 32;
    var plotW = Math.max(120, width - mL - mR), plotH = H - mT - mB;
    var max = opts.budget || 0;
    series.forEach(function (sr) { sr.values.forEach(function (v) { if (v > max) max = v; }); });
    var scale = niceScale(max);
    var n = labels.length, slot = plotW / n;
    var barW = Math.min(24, Math.max(4, (slot - 8) / series.length - 2));
    var groupW = series.length * barW + (series.length - 1) * 2;
    function y(v) { return mT + plotH - (v / scale.max) * plotH; }

    reportChartData[chartId] = { labels: labels.map(function (l) { return l.full; }), series: series, budget: opts.budget || 0 };

    var svg = '<svg class="rp-svg" viewBox="0 0 ' + width + ' ' + H + '" width="' + width + '" height="' + H + '" role="img" aria-label="' + escapeHtml(opts.aria || "") + '">';
    for (var t = 0; t <= scale.max + 0.001; t += scale.step) {
      svg += '<line class="' + (t === 0 ? 'base' : 'grid') + '" x1="' + mL + '" x2="' + (width - mR) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '"></line>';
      svg += '<text x="' + (mL - 6) + '" y="' + (y(t) + 3).toFixed(1) + '" text-anchor="end">' + money0(t) + '</text>';
    }
    for (var i = 0; i < n; i++) {
      var gx = mL + slot * i + (slot - groupW) / 2;
      series.forEach(function (sr, si) {
        var v = sr.values[i] || 0;
        var bh = (v / scale.max) * plotH;
        var bar = roundedTopBar((gx + si * (barW + 2)).toFixed(1), y(v).toFixed(1), barW, bh);
        if (bar) svg += bar + ' style="fill:' + sr.color + '"></path>';
      });
      svg += '<text x="' + (mL + slot * i + slot / 2).toFixed(1) + '" y="' + (H - 16) + '" text-anchor="middle">' + escapeHtml(labels[i].short) + '</text>';
      if (labels[i].year) svg += '<text x="' + (mL + slot * i + slot / 2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + escapeHtml(labels[i].year) + '</text>';
    }
    if (opts.budget) {
      svg += '<line class="bud" x1="' + mL + '" x2="' + (width - mR) + '" y1="' + y(opts.budget).toFixed(1) + '" y2="' + y(opts.budget).toFixed(1) + '"></line>';
      svg += '<text x="' + (width - mR) + '" y="' + (y(opts.budget) - 5).toFixed(1) + '" text-anchor="end">Budget ' + money0(opts.budget) + '</text>';
    }
    // hit targets: one full-height slot per month, bigger than the marks
    for (var j = 0; j < n; j++) {
      svg += '<rect class="hit" tabindex="0" data-chart="' + chartId + '" data-i="' + j + '" x="' + (mL + slot * j).toFixed(1) + '" y="' + mT + '" width="' + slot.toFixed(1) + '" height="' + plotH + '"></rect>';
    }
    return svg + '</svg>';
  }

  function renderReportBudget() {
    var rows = [], unbudgeted = [], budgeted = 0, spentB = 0;
    var exp = LEDGERS.filter(function (l) { return l.key === "expenses"; })[0];
    expenseCategories().forEach(function (c) {
      var spent = categoryTotal("expenses", c.cat);
      var b = budgetFor(exp, c.cat);
      if (b) { rows.push({ cat: c.cat, spent: spent, budget: b }); budgeted += b; spentB += spent; }
      else if (spent > 0) unbudgeted.push({ cat: c.cat, spent: spent });
    });
    var html = '<div class="rp-sub">' + escapeHtml(MONTH_NAMES[selectedMonth] + " " + selectedYear) + '</div>';
    if (!rows.length) {
      return html + '<div class="empty-note">No budgets set yet. Open an expense category and choose &ldquo;Set monthly budget&rdquo;.</div>' + renderUnbudgeted(unbudgeted);
    }
    var left = budgeted - spentB;
    html += '<div class="rp-tiles">' +
      '<div><span class="rp-tile-label">Budgeted</span><span class="rp-tile-value">$' + formatMoney(budgeted) + '</span></div>' +
      '<div><span class="rp-tile-label">Spent</span><span class="rp-tile-value">$' + formatMoney(spentB) + '</span></div>' +
      '<div><span class="rp-tile-label">' + (left < 0 ? 'Over' : 'Left') + '</span><span class="rp-tile-value' + (left < 0 ? ' over' : '') + '">$' + formatMoney(Math.abs(left)) + '</span></div>' +
      '</div>';
    rows.sort(function (a, b) { return b.spent / b.budget - a.spent / a.budget; });
    rows.forEach(function (r) {
      var over = r.spent > r.budget + 0.004;
      html += '<div class="rp-row"><div class="rp-row-top"><span class="name">' + escapeHtml(r.cat) + '</span>' +
        '<span class="rp-num">$' + formatMoney(r.spent) + ' / $' + formatMoney(r.budget) + '</span></div>' +
        '<div class="rp-meter' + (over ? ' over' : '') + '"><span style="width:' + Math.min(100, r.spent / r.budget * 100).toFixed(1) + '%"></span></div>' +
        '<div class="rp-status' + (over ? ' over' : '') + '">' + (over ? '$' + formatMoney(r.spent - r.budget) + ' over' : '$' + formatMoney(r.budget - r.spent) + ' left') +
        ' &middot; ' + Math.round(r.spent / r.budget * 100) + '% used</div></div>';
    });
    return html + renderUnbudgeted(unbudgeted);
  }

  function renderUnbudgeted(list) {
    if (!list.length) return "";
    list.sort(function (a, b) { return b.spent - a.spent; });
    var total = 0, html = "";
    list.forEach(function (r) {
      total += r.spent;
      html += '<div class="rp-row"><div class="rp-row-top"><span class="name">' + escapeHtml(r.cat) + '</span><span class="rp-num">$' + formatMoney(r.spent) + '</span></div></div>';
    });
    return '<div class="rp-h">No budget set &middot; $' + formatMoney(total) + '</div>' + html;
  }

  function renderReportTrends() {
    reportChartData = {};
    var width = Math.max(260, (reportBodyEl.clientWidth || 520) - 32);
    var keys = reportMonthKeys(reportMonths);
    var labels = keys.map(function (k) {
      return { short: SHORT_MONTHS[k.m], year: (k.m === 0 || k === keys[0]) ? String(k.y) : "", full: MONTH_NAMES[k.m] + " " + k.y };
    });
    var agg = collectMonthly();
    var inc = keys.map(function (k) { return agg.income[k.key] || 0; });
    var exp = keys.map(function (k) { return agg.expenses[k.key] || 0; });
    var expLedger = LEDGERS.filter(function (l) { return l.key === "expenses"; })[0];
    var catBudget = reportCat ? budgetFor(expLedger, reportCat) : 0;
    var catVals = keys.map(function (k) { return (reportCat ? (agg.byCat[reportCat] || {}) : agg.expenses)[k.key] || 0; });
    var catName = reportCat || "All expenses";

    var options = '<option value=""' + (reportCat ? '' : ' selected') + '>All expenses</option>';
    var lastGroup = null;
    expenseCategories().forEach(function (c) {
      if (c.group !== lastGroup) { if (lastGroup !== null) options += '</optgroup>'; options += '<optgroup label="' + escapeHtml(c.group || "") + '">'; lastGroup = c.group; }
      options += '<option value="' + escapeHtml(c.cat) + '"' + (c.cat === reportCat ? ' selected' : '') + '>' + escapeHtml(c.cat) + '</option>';
    });
    if (lastGroup !== null) options += '</optgroup>';

    var html = '<div class="rp-filters">' +
      '<span class="rp-seg" role="group" aria-label="Time range">' +
        '<button type="button" data-action="report-months" data-n="6" aria-pressed="' + (reportMonths === 6) + '">6 months</button>' +
        '<button type="button" data-action="report-months" data-n="12" aria-pressed="' + (reportMonths === 12) + '">12 months</button>' +
      '</span>' +
      '<label>Category <select data-action="report-cat" aria-label="Category">' + options + '</select></label>' +
      '<button type="button" class="rp-link" data-action="report-table">' + (reportTable ? 'Show charts' : 'Show table') + '</button>' +
      '</div>';

    if (reportTable) {
      html += '<table class="rp-table"><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th><th>' + escapeHtml(catName) + '</th></tr></thead><tbody>';
      for (var i = keys.length - 1; i >= 0; i--) {
        var net = inc[i] - exp[i];
        html += '<tr><td>' + escapeHtml(labels[i].full) + '</td><td>$' + formatMoney(inc[i]) + '</td><td>$' + formatMoney(exp[i]) + '</td><td>' +
          (net < 0 ? '-' : '') + '$' + formatMoney(Math.abs(net)) + '</td><td>$' + formatMoney(catVals[i]) + '</td></tr>';
      }
      return html + '</tbody></table>' + (catBudget ? '<div class="rp-sub" style="margin-top:8px">Monthly budget for ' + escapeHtml(catName) + ': $' + formatMoney(catBudget) + '</div>' : '');
    }

    html += '<div class="rp-chart-title">Income vs. expenses</div>' +
      '<div class="rp-legend"><span><i style="background:var(--series-income)"></i>Income</span><span><i style="background:var(--series-expense)"></i>Expenses</span></div>' +
      renderColumns("cmp", width, labels, [
        { name: "Income", color: "var(--series-income)", values: inc },
        { name: "Expenses", color: "var(--series-expense)", values: exp }
      ], { aria: "Income versus expenses by month" });
    html += '<div class="rp-chart-title" style="margin-top:16px">' + escapeHtml(catName) + ' by month</div>' +
      renderColumns("cat", width, labels, [
        { name: catName, color: "var(--series-expense)", values: catVals }
      ], { budget: catBudget, aria: catName + " spending by month" });
    return html;
  }

  // Latest occurrence of every active recurring series, plus the month it started.
  function recurringSeriesList() {
    var out = [];
    LEDGERS.forEach(function (ledger) {
      var data = ledgerData(ledger.key);
      for (var cat in data) {
        var templates = {}, firstDate = {};
        (data[cat] || []).forEach(function (p) {
          if (!p.recurDay || !p.seriesId) return;
          if (!templates[p.seriesId] || p.date > templates[p.seriesId].date) templates[p.seriesId] = p;
          if (!firstDate[p.seriesId] || p.date < firstDate[p.seriesId]) firstDate[p.seriesId] = p.date;
        });
        Object.keys(templates).forEach(function (sid) {
          out.push({ ledger: ledger, cat: cat, tmpl: templates[sid], first: firstDate[sid], sid: sid });
        });
      }
    });
    return out;
  }

  function signedNet(inc, exp) {
    var n = inc - exp;
    return (n < 0 ? "-" : "") + "$" + formatMoney(Math.abs(n));
  }

  function renderReportForecast() {
    var today = todayISO();
    var mk = monthKeyOf(selectedYear, selectedMonth);
    var incDone = 0, expDone = 0, incSoon = 0, expSoon = 0, upcoming = [];
    LEDGERS.forEach(function (ledger) {
      var data = ledgerData(ledger.key);
      for (var cat in data) {
        (data[cat] || []).forEach(function (p) {
          if (String(p.date || "").slice(0, 7) !== mk) return;
          var amt = Number(p.amount) || 0;
          var soon = p.date > today;
          if (ledger.key === "income") { if (soon) incSoon += amt; else incDone += amt; }
          else { if (soon) expSoon += amt; else expDone += amt; }
          if (soon) upcoming.push({ date: p.date, cat: cat, desc: p.description, amt: amt, tone: ledger.tone });
        });
      }
    });
    upcoming.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var html = '<div class="rp-sub">' + escapeHtml(MONTH_NAMES[selectedMonth] + " " + selectedYear) + ' &middot; month-end projection</div>';
    html += '<div class="rp-tiles">' +
      '<div><span class="rp-tile-label">Income</span><span class="rp-tile-value">$' + formatMoney(incDone + incSoon) + '</span></div>' +
      '<div><span class="rp-tile-label">Expenses</span><span class="rp-tile-value">$' + formatMoney(expDone + expSoon) + '</span></div>' +
      '<div><span class="rp-tile-label">Projected net</span><span class="rp-tile-value' + (incDone + incSoon < expDone + expSoon ? ' over' : '') + '">' + signedNet(incDone + incSoon, expDone + expSoon) + '</span></div>' +
      '</div>';
    html += '<div class="rp-h">Still to come this month &middot; ' + upcoming.length + '</div>';
    if (!upcoming.length) {
      html += '<div class="empty-note">Nothing dated after today.</div>';
    } else {
      upcoming.forEach(function (u) {
        html += '<div class="rp-row"><div class="rp-row-top"><span class="name">' + escapeHtml(formatDate(u.date)) + ' &middot; ' + escapeHtml(u.desc) + ' <span class="rp-status">(' + escapeHtml(u.cat) + ')</span></span>' +
          '<span class="rp-num">' + (u.tone === "credit" ? '+' : '-') + '$' + formatMoney(u.amt) + '</span></div></div>';
      });
    }

    // Next month: recurring entries that will be created, plus typical non-recurring spending.
    var ny = selectedYear, nm = selectedMonth + 1;
    if (nm > 11) { nm = 0; ny += 1; }
    var nk = monthKeyOf(ny, nm);
    var nextDays = new Date(ny, nm + 1, 0).getDate();
    var recInc = 0, recExp = 0, recItems = [];
    recurringSeriesList().forEach(function (r) {
      if (r.first.slice(0, 7) > nk) return;
      var already = (ledgerData(r.ledger.key)[r.cat] || []).some(function (p) { return p.seriesId === r.sid && String(p.date).slice(0, 7) === nk; });
      if (already) return;
      var amt = Number(r.tmpl.amount) || 0;
      if (r.ledger.key === "income") recInc += amt; else recExp += amt;
      recItems.push({ day: Math.min(r.tmpl.recurDay, nextDays), desc: r.tmpl.description, cat: r.cat, amt: amt, tone: r.ledger.tone });
    });
    recItems.sort(function (a, b) { return a.day - b.day; });

    // average non-recurring spending over the 3 most recent complete months before next month
    var endY = ny, endM = nm - 1;
    if (endM < 0) { endM = 11; endY -= 1; }
    if (endY > now.getFullYear() || (endY === now.getFullYear() && endM >= now.getMonth())) {
      endY = now.getFullYear(); endM = now.getMonth() - 1;
      if (endM < 0) { endM = 11; endY -= 1; }
    }
    var avgKeys = {};
    var ay = endY, am = endM;
    for (var i = 0; i < 3; i++) {
      avgKeys[monthKeyOf(ay, am)] = true;
      am -= 1;
      if (am < 0) { am = 11; ay -= 1; }
    }
    var otherTotal = 0, otherMonthsWithData = {};
    var expData = ledgerData("expenses");
    for (var c in expData) {
      (expData[c] || []).forEach(function (p) {
        var k = String(p.date || "").slice(0, 7);
        if (p.seriesId || !avgKeys[k]) return;
        otherTotal += Number(p.amount) || 0;
        otherMonthsWithData[k] = true;
      });
    }
    var monthsUsed = Object.keys(otherMonthsWithData).length;
    var avgOther = monthsUsed ? otherTotal / monthsUsed : 0;

    html += '<div class="rp-h">Next month &middot; ' + escapeHtml(MONTH_NAMES[nm] + " " + ny) + '</div>';
    html += '<div class="rp-tiles">' +
      '<div><span class="rp-tile-label">Recurring income</span><span class="rp-tile-value">$' + formatMoney(recInc) + '</span></div>' +
      '<div><span class="rp-tile-label">Recurring bills</span><span class="rp-tile-value">$' + formatMoney(recExp) + '</span></div>' +
      '<div><span class="rp-tile-label">Typical other</span><span class="rp-tile-value">$' + formatMoney(avgOther) + '</span></div>' +
      '<div><span class="rp-tile-label">Projected net</span><span class="rp-tile-value' + (recInc < recExp + avgOther ? ' over' : '') + '">' + signedNet(recInc, recExp + avgOther) + '</span></div>' +
      '</div>';
    if (recItems.length) {
      recItems.forEach(function (r) {
        html += '<div class="rp-row"><div class="rp-row-top"><span class="name">Day ' + r.day + ' &middot; ' + escapeHtml(r.desc) + ' <span class="rp-status">(' + escapeHtml(r.cat) + ')</span></span>' +
          '<span class="rp-num">' + (r.tone === "credit" ? '+' : '-') + '$' + formatMoney(r.amt) + '</span></div></div>';
      });
    } else {
      html += '<div class="empty-note">No recurring entries are waiting for next month.</div>';
    }
    html += '<div class="rp-note">Built from your recurring entries plus the average of non-recurring spending over ' +
      (monthsUsed ? monthsUsed + ' recent month' + (monthsUsed === 1 ? '' : 's') : 'recent months (none recorded yet)') +
      '. One-off income is not predicted.</div>';
    return html;
  }

  function renderReportSearch() {
    var options = '<option value="">All categories</option>';
    LEDGERS.forEach(function (ledger) {
      ledger.groups.forEach(function (g) {
        options += '<optgroup label="' + escapeHtml((ledger.sectionLabel) + (g.name ? " – " + g.name : "")) + '">';
        g.categories.forEach(function (c) {
          options += '<option value="' + escapeHtml(c) + '"' + (c === searchCat ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
        });
        options += '</optgroup>';
      });
    });
    return '<div class="rp-filters">' +
      '<input type="search" data-action="search-text" placeholder="Description, category or amount" aria-label="Search entries" value="' + escapeHtml(searchText) + '" autocomplete="off">' +
      '<select data-action="search-cat" aria-label="Category">' + options + '</select>' +
      '</div><div id="rp-results"></div>';
  }

  function updateSearchResults() {
    var box = document.getElementById("rp-results");
    if (!box) return;
    var q = searchText.trim().toLowerCase();
    var qNum = q !== "" && !isNaN(Number(q.replace(/[$,]/g, ""))) ? Number(q.replace(/[$,]/g, "")) : null;
    if (!q && !searchCat) {
      box.innerHTML = '<div class="empty-note">Type to search every month, or pick a category to list all of its entries.</div>';
      return;
    }
    var hits = [];
    LEDGERS.forEach(function (ledger) {
      var data = ledgerData(ledger.key);
      for (var cat in data) {
        if (searchCat && cat !== searchCat) continue;
        (data[cat] || []).forEach(function (p) {
          if (q) {
            var textHit = String(p.description || "").toLowerCase().indexOf(q) !== -1 || cat.toLowerCase().indexOf(q) !== -1;
            var amtHit = qNum !== null && Math.abs((Number(p.amount) || 0) - qNum) < 0.005;
            if (!textHit && !amtHit) return;
          }
          hits.push({ date: p.date, cat: cat, desc: p.description, amt: Number(p.amount) || 0, tone: ledger.tone });
        });
      }
    });
    hits.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    if (!hits.length) { box.innerHTML = '<div class="empty-note">No matching entries.</div>'; return; }
    var inc = 0, exp = 0;
    hits.forEach(function (h) { if (h.tone === "credit") inc += h.amt; else exp += h.amt; });
    var shown = hits.slice(0, 200);
    var html = '<div class="rp-sub">' + hits.length + ' match' + (hits.length === 1 ? '' : 'es') +
      (inc ? ' &middot; income $' + formatMoney(inc) : '') + (exp ? ' &middot; expenses $' + formatMoney(exp) : '') +
      (hits.length > shown.length ? ' &middot; showing newest 200' : '') + '</div>';
    shown.forEach(function (h) {
      html += '<button type="button" class="rp-res" data-action="report-goto" data-date="' + escapeHtml(h.date) + '">' +
        '<span class="d">' + escapeHtml(formatDate(h.date)) + '</span>' +
        '<span class="m"><b>' + escapeHtml(h.desc) + '</b><small>' + escapeHtml(h.cat) + '</small></span>' +
        '<span class="a ' + h.tone + '">' + (h.tone === "credit" ? '+' : '-') + '$' + formatMoney(h.amt) + '</span></button>';
    });
    box.innerHTML = html;
  }

  function renderReport() {
    var tabs = reportOverlayEl.querySelectorAll('[data-action="report-tab"]');
    for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute("aria-selected", String(tabs[i].getAttribute("data-tab") === reportTab));
    reportBodyEl.innerHTML = reportTab === "budget" ? renderReportBudget()
      : reportTab === "trends" ? renderReportTrends()
      : reportTab === "forecast" ? renderReportForecast()
      : renderReportSearch();

  }

    reportOverlayEl.hidden = false;

    reportOverlayEl.hidden = true;
    reportTipEl.hidden = true;
  }

  function showReportTip(hit, ev) {
    var data = reportChartData[hit.getAttribute("data-chart")];
    var i = Number(hit.getAttribute("data-i"));
    if (!data) return;
    reportTipEl.textContent = "";
    var head = document.createElement("div");
    head.className = "t-head";
    head.textContent = data.labels[i];
    reportTipEl.appendChild(head);
    data.series.forEach(function (sr) {
      var row = document.createElement("div");
      row.className = "t-row";
      var key = document.createElement("span");
      key.className = "t-key";
      key.style.background = sr.color;
      var val = document.createElement("span");
      val.className = "t-val";
      val.textContent = "$" + formatMoney(sr.values[i] || 0);
      var name = document.createElement("span");
      name.className = "t-name";
      name.textContent = sr.name;
      row.appendChild(key); row.appendChild(val); row.appendChild(name);
      reportTipEl.appendChild(row);
    });
    reportTipEl.hidden = false;
    var box = hit.getBoundingClientRect();
    var x = ev && ev.clientX !== undefined && ev.type !== "focusin" ? ev.clientX : box.left + box.width / 2;
    var w = reportTipEl.offsetWidth, h = reportTipEl.offsetHeight;
    var left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8);
    var top = box.top - h - 8;
    if (top < 8) top = box.top + 16;
    reportTipEl.style.left = left + "px";
    reportTipEl.style.top = top + "px";
  }

  function renderSyncBar() {
    syncDotEl.className = "sync-dot" + (drive.status === "connected" || drive.status === "syncing" ? " connected" : drive.status === "error" ? " error" : "");
    var labels = {
      disconnected: "Not connected — saving to this PC only",
      connecting: "Connecting to Google Drive…",
      connected: "Synced with Google Drive",
      syncing: "Saving to Google Drive…",
      error: drive.message || "Google Drive sync error"
    };
    syncLabelEl.textContent = labels[drive.status] || "";
    var isConnected = drive.status === "connected" || drive.status === "syncing";
    connectBtnEl.hidden = isConnected;

    disconnectBtnEl.hidden = !isConnected;
    shareRowEl.hidden = !isConnected;
