  function auditActionLabel(entry) {
    var verb = entry.action === "delete" ? "deleted" : entry.action === "edit" ? "edited" : "added";
    var noun = entry.ledger === "income" ? "income" : "an expense";
    return verb + " " + noun;
  }

  function renderAuditBody() {
    if (auditLoading) {
      auditBodyEl.innerHTML = '<div class="empty-note">Loading…</div>';
      return;
    }
    if (drive.status !== "connected" && drive.status !== "syncing") {
      auditBodyEl.innerHTML = '<div class="empty-note">Connect Google Drive to see who logged what.</div>';
      return;
    }
    if (!auditLog.length) {
      auditBodyEl.innerHTML = '<div class="empty-note">No activity logged yet.</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < auditLog.length; i++) {
      var e = auditLog[i];
      html += '<div class="audit-row">';
      html += '<div class="audit-line1">';
      html += '<span><span class="audit-who">' + escapeHtml(e.user || "Unknown") + '</span> <span class="audit-action ' + (e.action === "delete" ? "delete" : e.action === "edit" ? "edit" : "add") + '">' + auditActionLabel(e) + '</span></span>';
      html += '<span class="audit-ts">' + escapeHtml(formatTimestamp(e.ts)) + '</span>';
      html += '</div>';
      html += '<div class="audit-detail"><span class="amt">$' + formatMoney(e.amount) + '</span> · ' + escapeHtml(e.category) + ' · ' + escapeHtml(e.description) + ' (' + escapeHtml(formatDate(e.date)) + ')';
      if (e.action === "edit" && e.previous) {
        html += '<span class="was">was $' + formatMoney(e.previous.amount) + ' · ' + escapeHtml(e.previous.description) + ' (' + escapeHtml(formatDate(e.previous.date)) + ')</span>';
      }
      html += '</div>';
      html += '</div>';
    }
    auditBodyEl.innerHTML = html;
  }

  async function openAudit() {
    auditOpen = true;
    auditOverlayEl.hidden = false;
    if (drive.status === "connected" || drive.status === "syncing") {
      auditLoading = true;
      renderAuditBody();
      try {
        var data = await readDriveJson(drive.auditFileId);
        auditLog = (data && data.entries) || [];
      } catch (e) {
        auditLog = [];
      }
      auditLoading = false;
    }
    renderAuditBody();
  }

  function closeAudit() {
    auditOpen = false;
    auditOverlayEl.hidden = true;
  }

  function render() {
    var income = ledgerTotal("income");
    var expenses = ledgerTotal("expenses");
    var net = income - expenses;

    incomeTotalEl.textContent = "$" + formatMoney(income);
    expensesTotalEl.textContent = "$" + formatMoney(expenses);
    netTotalEl.textContent = (net < 0 ? "-$" : "$") + formatMoney(Math.abs(net));
    netStatEl.classList.toggle("negative", net < 0);

    monthLabelEl.textContent = MONTH_NAMES[selectedMonth] + " " + selectedYear;
    todayBtnEl.hidden = isCurrentSystemMonth();

    renderSyncBar();

    loadErrorEl.hidden = !state.loadError;
    loadErrorEl.textContent = state.loadError;

    if (!state.loaded) {
      ledgerRoot.innerHTML = '<div class="loading-row">Opening the ledger…</div>';
      return;
    }

    ledgerRoot.innerHTML = renderListView();

    if (addingCategory) {
      var form = ledgerRoot.querySelector('form[data-role="add-form"][data-ledger="' + addingCategory.ledger + '"][data-cat="' + cssEscape(addingCategory.cat) + '"]');
      var descInput = form && form.querySelector('input[name="description"]');
      if (descInput) descInput.focus();
    }
    if (editingEntry) {
      var eform = ledgerRoot.querySelector('form[data-role="edit-form"][data-id="' + cssEscape(editingEntry.id) + '"]');
      var edescInput = eform && eform.querySelector('input[name="description"]');
      if (edescInput) edescInput.focus();
    }
  }

  function cssEscape(s) {
    return window.CSS && CSS.escape ? CSS.escape(s) : s.replace(/["\\]/g, "\\$&");
  }

  function emptyData() { return { income: {}, expenses: {}, creditCards: {}, budgets: {} }; }

  function normalizeBody(body) {
    if (!body) return emptyData();
    if (body.income || body.expenses || body.creditCards || body.budgets) {
      // creditCards used to be a flat array (Credit Card Payment only) before it became per-category
      var cc = body.creditCards;
      if (Array.isArray(cc)) cc = { "Credit Card Payment": cc };
      return { income: body.income || {}, expenses: body.expenses || {}, creditCards: cc || {}, budgets: body.budgets || {} };
    }
    return emptyData();
  }

  // ---------- Local cache (always mirrors the last known-good state) ----------

  function saveLocalCache(data) {
    try { localStorage.setItem(LS_DATA_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadLocalCache() {
    try {
      var raw = localStorage.getItem(LS_DATA_KEY);
      return raw ? normalizeBody(JSON.parse(raw)) : emptyData();
    } catch (e) {
      return emptyData();
    }
  }

  // ---------- Google Drive sync ----------

  function driveAuthHeaders() { return { Authorization: "Bearer " + drive.accessToken }; }

  function ensureTokenClient() {
    if (drive.tokenClient) return drive.tokenClient;
    drive.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: function () {}
    });
    return drive.tokenClient;
  }

  function requestAccessToken(interactive) {
    return new Promise(function (resolve, reject) {
      var client = ensureTokenClient();
      client.callback = function (resp) {
        if (resp && resp.error) { reject(resp); return; }
        drive.accessToken = resp.access_token;
        resolve(drive.accessToken);
      };
      client.error_callback = function (err) { reject(err); };
      client.requestAccessToken({ prompt: interactive ? "consent" : "" });
    });
  }

  async function driveFetch(url, options, retried) {
    options = options || {};
    options.headers = Object.assign({}, options.headers, driveAuthHeaders());
    var res = await fetch(url, options);
    if (res.status === 401 && !retried) {
      await requestAccessToken(false);
      return driveFetch(url, options, true);
    }
    return res;
  }

  async function driveErrorMessage(res, fallback) {
    try {
      var body = await res.clone().json();
      if (body && body.error && body.error.message) return fallback + ": " + body.error.message;
    } catch (e) {}
    return fallback + " (" + res.status + ")";
  }

  // Generic: find a file by name, or create it empty. Returns { id, created }.
  async function findOrCreateNamedFile(name, knownId) {
    if (knownId) {
      var check = await driveFetch("https://www.googleapis.com/drive/v3/files/" + knownId + "?fields=id,trashed");
      if (check.ok) {
        var meta = await check.json();
        if (!meta.trashed) return { id: knownId, created: false };
      }
    }
    var q = encodeURIComponent("name='" + name + "' and trashed=false");
    var listRes = await driveFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&spaces=drive&fields=files(id,name)");
    if (!listRes.ok) throw new Error(await driveErrorMessage(listRes, "Couldn't search Google Drive"));
    var listJson = await listRes.json();
    if (listJson.files && listJson.files.length) {
      return { id: listJson.files[0].id, created: false };
    }
    var createRes = await driveFetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, mimeType: "application/json" })
    });
    if (!createRes.ok) throw new Error(await driveErrorMessage(createRes, "Couldn't create " + name + " in Google Drive"));
    var createJson = await createRes.json();
    return { id: createJson.id, created: true };
  }

  async function readDriveJson(fileId) {
    var res = await driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media");
    if (!res.ok) throw new Error(await driveErrorMessage(res, "Couldn't read from Google Drive"));
    var text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function writeDriveJson(fileId, data) {
    var res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(await driveErrorMessage(res, "Couldn't save to Google Drive"));
  }

  async function findOrCreateDriveFile() {
    var result = await findOrCreateNamedFile(DRIVE_FILE_NAME, drive.fileId);
    drive.fileId = result.id;
    if (result.created) await writeDriveJson(drive.fileId, emptyData());
    localStorage.setItem(LS_FILEID_KEY, drive.fileId);
    return drive.fileId;
  }

  async function findOrCreateAuditFile() {
    var result = await findOrCreateNamedFile(DRIVE_AUDIT_FILE_NAME, drive.auditFileId);
    drive.auditFileId = result.id;
    if (result.created) await writeDriveJson(drive.auditFileId, { entries: [] });
    localStorage.setItem(LS_AUDIT_FILEID_KEY, drive.auditFileId);
    return drive.auditFileId;
  }

  // ---------- Monthly backups ----------
  // On (or after) the 1st of each month, snapshot the previous month's
  // ledger into its own dated Drive file — a separate backup per month,
  // never overwritten. Checked at most once per calendar day.

  function monthKeyOf(y, m) { return y + "-" + pad2(m + 1); }

  function previousMonthKey(d) {
    var y = d.getFullYear();
    var m = d.getMonth() - 1;
    if (m < 0) { m = 11; y -= 1; }
    return monthKeyOf(y, m);
  }

  var lastBackupCheckDate = null;

  async function ensureMonthlyBackup() {
    var key = previousMonthKey(new Date());
    var name = "household-ledger-backup-" + key + ".json";
    try {
      var result = await findOrCreateNamedFile(name, null);
      if (result.created) {
        await writeDriveJson(result.id, { backupFor: key, createdAt: new Date().toISOString(), data: state.data });
      }
    } catch (e) {
      // best-effort — the next daily check will retry
    }
  }

  function maybeRunMonthlyBackup() {
    if (drive.status !== "connected" && drive.status !== "syncing") return;
    var today = todayISO();
    if (lastBackupCheckDate === today) return;
    lastBackupCheckDate = today;
    ensureMonthlyBackup();
  }

  async function readDriveFile() {
    var data = await readDriveJson(drive.fileId);
    return data || emptyData();
  }

  async function writeDriveFile(data) {
    await writeDriveJson(drive.fileId, data);
  }

  async function fetchDriveUser() {
    try {
      var res = await driveFetch("https://www.googleapis.com/drive/v3/about?fields=user");
      if (!res.ok) return;
      var json = await res.json();
      drive.userName = (json.user && (json.user.displayName || json.user.emailAddress)) || "";
    } catch (e) {}
  }

  async function recordAudit(action, ledgerKey, cat, entry, previous) {
    if (!drive.auditFileId || (drive.status !== "connected" && drive.status !== "syncing")) return;
    try {
      var current = await readDriveJson(drive.auditFileId);
      var list = (current && current.entries) || [];
      var record = {
        id: makeId(),
        ts: new Date().toISOString(),
        user: drive.userName || "Unknown",
        action: action,
        ledger: ledgerKey,
        category: cat,
        description: entry.description,
        amount: entry.amount,
        date: entry.date
      };
      if (previous) {
        record.previous = { description: previous.description, amount: previous.amount, date: previous.date };
      }
      list.unshift(record);
      if (list.length > 500) list = list.slice(0, 500);
      await writeDriveJson(drive.auditFileId, { entries: list });
      auditLog = list;
    } catch (e) {
      // best-effort — never block a ledger edit on the audit log
    }
  }

  function stopPolling() {
    if (drive.pollTimer) { clearInterval(drive.pollTimer); drive.pollTimer = null; }
  }

  function startPolling() {
    stopPolling();
    drive.pollTimer = setInterval(refreshFromDrive, 60000);
    document.addEventListener("visibilitychange", onVisibilityChange);
  }

  function onVisibilityChange() {
    if (document.visibilityState === "visible") refreshFromDrive();
  }

  async function refreshFromDrive() {
    if (drive.status !== "connected" || drive.pendingWrite) return;
    try {
      var data = await readDriveFile();
      state.data = normalizeBody(data);
      saveLocalCache(state.data);
      render();
      maybeRunMonthlyBackup();
    } catch (e) {
      // keep showing the last known-good state; next poll tries again
    }
  }

  async function connectDrive(interactive) {
    if (GOOGLE_CLIENT_ID.indexOf("REPLACE_WITH") === 0) {
      drive.status = "error";
      drive.message = "Add your Google OAuth Client ID at the top of this file's script first.";
      renderSyncBar();
      return;
    }
    drive.status = "connecting";
    renderSyncBar();
    try {
      await requestAccessToken(interactive);
      await findOrCreateDriveFile();
      await findOrCreateAuditFile();
      await fetchDriveUser();
      var data = await readDriveFile();
      state.data = normalizeBody(data);
      state.loaded = true;
      saveLocalCache(state.data);
      drive.status = "connected";
      localStorage.setItem(LS_MODE_KEY, "drive");
      render();
      materializeRecurring();
      startPolling();
      maybeRunMonthlyBackup();
    } catch (e) {
      drive.status = "error";
      drive.message = (e && e.message) || "Couldn't connect to Google Drive.";
      render();
    }
  }

  async function shareOneFile(fileId, email, notify) {
    var res = await driveFetch(
      "https://www.googleapis.com/drive/v3/files/" + fileId + "/permissions?sendNotificationEmail=" + (notify ? "true" : "false"),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: "writer", type: "user", emailAddress: email })
      }
    );
    if (!res.ok) {
      var errJson = await res.json().catch(function () { return null; });
      throw new Error((errJson && errJson.error && errJson.error.message) || ("Share failed (" + res.status + ")"));
    }
  }

  async function shareFile() {
    var email = shareEmailEl.value.trim();
    if (!email) return;
    if (!drive.fileId) { shareMsgEl.textContent = "Connect first."; return; }
    shareMsgEl.textContent = "Sharing…";
    try {
      await shareOneFile(drive.fileId, email, true);
      if (drive.auditFileId) await shareOneFile(drive.auditFileId, email, false);
      shareMsgEl.textContent = "Shared with " + email + " — they can now connect to the same file.";
      shareEmailEl.value = "";
    } catch (e) {
      shareMsgEl.textContent = (e && e.message) || "Couldn't share the file.";
    }
  }

  function disconnectDrive() {
    stopPolling();
    drive.status = "disconnected";
    drive.accessToken = null;
    localStorage.setItem(LS_MODE_KEY, "local");
    render();
  }

  // ---------- Persist (routes to Drive when connected, else local only) ----------

  async function persist(nextData) {
    state.data = nextData;
    saveLocalCache(nextData);
    render();
    if (drive.status === "connected" || drive.status === "syncing") {
      drive.pendingWrite = true;
      drive.status = "syncing";
      renderSyncBar();
      try {
        await writeDriveFile(nextData);
        drive.status = "connected";
      } catch (e) {
        drive.status = "error";
        drive.message = (e && e.message) || "Couldn't save to Google Drive — your change is kept on this PC.";
      }
      drive.pendingWrite = false;
      renderSyncBar();
    }
  }

  function goToMonthOf(iso) {
    var p = parseISO(iso);
    selectedYear = p.y;
    selectedMonth = p.m;
  }

  function addEntry(ledgerKey, cat, entry) {
    var list = ledgerData(ledgerKey)[cat] || [];
    var stored = { id: makeId(), date: entry.date, description: entry.description, amount: entry.amount };
    if (entry.recurring) {
      stored.recurDay = parseISO(entry.date).d;
      stored.seriesId = makeId();
    }
    var nextLedger = Object.assign({}, ledgerData(ledgerKey));
    nextLedger[cat] = list.concat([stored]);
    var next = Object.assign({}, state.data);
    next[ledgerKey] = nextLedger;
    if (!inSelectedMonth(entry.date)) goToMonthOf(entry.date);
    persist(next);
    recordAudit("add", ledgerKey, cat, entry);
  }

  function editEntry(ledgerKey, cat, id, patch) {
    var list = ledgerData(ledgerKey)[cat] || [];
    var index = -1;
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) { index = i; break; } }
    if (index === -1) return;
    var before = list[index];
    var after = Object.assign({}, before, patch);
    var nextList = list.slice();
    nextList[index] = after;
    var nextLedger = Object.assign({}, ledgerData(ledgerKey));
    nextLedger[cat] = nextList;
    var next = Object.assign({}, state.data);
    next[ledgerKey] = nextLedger;
    if (!inSelectedMonth(after.date)) goToMonthOf(after.date);
    persist(next);
    recordAudit("edit", ledgerKey, cat, after, before);
  }

  function deleteEntry(ledgerKey, cat, id) {
    var list = ledgerData(ledgerKey)[cat] || [];
    var removed = list.find(function (p) { return p.id === id; });
    var nextLedger = Object.assign({}, ledgerData(ledgerKey));
    nextLedger[cat] = list.filter(function (p) { return p.id !== id; });
    var next = Object.assign({}, state.data);
    next[ledgerKey] = nextLedger;
    persist(next);
    if (removed) recordAudit("delete", ledgerKey, cat, removed);
  }

  function setBudget(cat, amount) {
    var nextBudgets = Object.assign({}, state.data.budgets);
    if (amount > 0) nextBudgets[cat] = amount; else delete nextBudgets[cat];
    var next = Object.assign({}, state.data);
    next.budgets = nextBudgets;
    persist(next);
  }

  function creditCardsFor(cat) {
    return (state.data.creditCards && state.data.creditCards[cat]) || [];
  }

  function addCreditCard(cat, card) {
    var next = Object.assign({}, state.data);
    var nextCC = Object.assign({}, state.data.creditCards);
    nextCC[cat] = creditCardsFor(cat).concat([{
      id: makeId(), name: card.name, balance: card.balance, minPayment: card.minPayment, autopay: !!card.autopay
    }]);
    next.creditCards = nextCC;
    persist(next);
  }

  function editCreditCard(cat, id, patch) {
    var next = Object.assign({}, state.data);
    var nextCC = Object.assign({}, state.data.creditCards);
    nextCC[cat] = creditCardsFor(cat).map(function (c) {
      return c.id === id ? Object.assign({}, c, patch) : c;
    });
    next.creditCards = nextCC;
    persist(next);
  }

  function deleteCreditCard(cat, id) {
    var next = Object.assign({}, state.data);
    var nextCC = Object.assign({}, state.data.creditCards);
    nextCC[cat] = creditCardsFor(cat).filter(function (c) { return c.id !== id; });
    next.creditCards = nextCC;
    persist(next);
  }

  function stopRecurring(ledgerKey, cat, seriesId) {
    var list = ledgerData(ledgerKey)[cat] || [];
    var nextList = list.map(function (p) {
      if (p.seriesId !== seriesId) return p;
      var copy = Object.assign({}, p);
      delete copy.recurDay;
      delete copy.seriesId;
      return copy;
    });
    var nextLedger = Object.assign({}, ledgerData(ledgerKey));
    nextLedger[cat] = nextList;
    var next = Object.assign({}, state.data);
    next[ledgerKey] = nextLedger;
    persist(next);
  }

  // Lazily materializes this month's occurrence of any recurring series
  // that doesn't already have one — only for months actually visited.
  function materializeRecurring() {
    if (!state.loaded) return;
    var next = null;
    function draft() {
      if (!next) next = { income: Object.assign({}, state.data.income), expenses: Object.assign({}, state.data.expenses), creditCards: state.data.creditCards || {}, budgets: state.data.budgets || {} };
      return next;
    }
    LEDGERS.forEach(function (ledger) {
      var data = state.data[ledger.key] || {};
      for (var cat in data) {
        var list = data[cat] || [];
        var templates = {};
        var firstDate = {};
        list.forEach(function (p) {
          if (!p.recurDay || !p.seriesId) return;
          if (!templates[p.seriesId] || p.date > templates[p.seriesId].date) templates[p.seriesId] = p;
          if (!firstDate[p.seriesId] || p.date < firstDate[p.seriesId]) firstDate[p.seriesId] = p.date;
        });
        Object.keys(templates).forEach(function (sid) {
          var startP = parseISO(firstDate[sid]);
          if (selectedYear < startP.y || (selectedYear === startP.y && selectedMonth < startP.m)) return;
          var alreadyInMonth = list.some(function (p) { return p.seriesId === sid && inSelectedMonth(p.date); });
          if (alreadyInMonth) return;
          var tmpl = templates[sid];
          var day = Math.min(tmpl.recurDay, daysInSelectedMonth());
          var newDate = selectedYear + "-" + pad2(selectedMonth + 1) + "-" + pad2(day);
          var newEntry = { id: makeId(), date: newDate, description: tmpl.description, amount: tmpl.amount, recurDay: tmpl.recurDay, seriesId: sid };
          var d = draft();
          d[ledger.key] = Object.assign({}, d[ledger.key]);
          d[ledger.key][cat] = (d[ledger.key][cat] || []).concat([newEntry]);
        });
      }
    });
    if (next) persist(next);
  }

  document.querySelector(".month-bar").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "prev-month") {
      selectedMonth -= 1;
      if (selectedMonth < 0) { selectedMonth = 11; selectedYear -= 1; }
      render();
      materializeRecurring();
    } else if (action === "next-month") {
      selectedMonth += 1;
      if (selectedMonth > 11) { selectedMonth = 0; selectedYear += 1; }
      render();
      materializeRecurring();
    } else if (action === "jump-today") {
      selectedYear = now.getFullYear();
      selectedMonth = now.getMonth();
      render();
      materializeRecurring();
    } else if (action === "toggle-export-menu") {
      var willOpen = exportDropdownEl.hidden;
      exportDropdownEl.hidden = !willOpen;
      el.setAttribute("aria-expanded", String(willOpen));
    } else if (action === "export-csv") {
      exportCsv();
      closeExportMenu();
    } else if (action === "export-all") {
      exportAllCsv();
      closeExportMenu();
    } else if (action === "export-audit") {
      exportAuditLog();
      closeExportMenu();
    }
  });

  function closeExportMenu() {
    exportDropdownEl.hidden = true;
    document.querySelector('[data-action="toggle-export-menu"]').setAttribute("aria-expanded", "false");
  }
  document.addEventListener("click", function (e) {
    if (!exportDropdownEl.hidden && !e.target.closest(".export-menu")) closeExportMenu();
  });

  document.querySelector(".sync-bar").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "connect-drive") connectDrive(true);
    else if (action === "disconnect-drive") disconnectDrive();
  });

  shareRowEl.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (el && el.getAttribute("data-action") === "share-file") shareFile();
  });
  shareEmailEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); shareFile(); }
  });

  ledgerRoot.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var ledgerKey = el.getAttribute("data-ledger");
    var cat = el.getAttribute("data-cat");

    if (action === "toggle-category") {
      var isSame = openCategory && openCategory.ledger === ledgerKey && openCategory.cat === cat;
      openCategory = isSame ? null : { ledger: ledgerKey, cat: cat };
      addingCategory = null;
      editingEntry = null;
      addingCard = false;
      editingCardId = null;
      editingBudgetCat = null;
      render();
    } else if (action === "edit-budget") {
      editingBudgetCat = cat;
      render();
      var bInput = ledgerRoot.querySelector('form[data-role="budget-form"] input[name="budget"]');
      if (bInput) bInput.focus();
    } else if (action === "cancel-budget") {
      editingBudgetCat = null;
      render();
    } else if (action === "clear-budget") {
      editingBudgetCat = null;
      setBudget(cat, null);
    } else if (action === "show-add") {
      addingCategory = { ledger: ledgerKey, cat: cat };
      editingEntry = null;
      render();
    } else if (action === "cancel-add") {
      addingCategory = null;
      render();
    } else if (action === "edit-entry") {
      editingEntry = { ledger: ledgerKey, cat: cat, id: el.getAttribute("data-id") };
      addingCategory = null;
      render();
    } else if (action === "cancel-edit") {
      editingEntry = null;
      render();
    } else if (action === "delete-entry") {
      var deletedId = el.getAttribute("data-id");
      if (editingEntry && editingEntry.id === deletedId) editingEntry = null;
      deleteEntry(ledgerKey, cat, deletedId);
    } else if (action === "stop-recur") {
      stopRecurring(ledgerKey, cat, el.getAttribute("data-series"));
    } else if (action === "show-add-card") {
      addingCard = true;
      editingCardId = null;
      render();
    } else if (action === "cancel-add-card") {
      addingCard = false;
      render();
    } else if (action === "edit-card") {
      editingCardId = el.getAttribute("data-id");
      addingCard = false;
      render();
    } else if (action === "cancel-edit-card") {
      editingCardId = null;
      render();
    } else if (action === "delete-card") {
      var deletedCardId = el.getAttribute("data-id");
      if (editingCardId === deletedCardId) editingCardId = null;
      deleteCreditCard(openCategory.cat, deletedCardId);
    }
  });

  ledgerRoot.addEventListener("submit", function (e) {
    var addForm = e.target.closest('form[data-role="add-form"]');
    var editForm = e.target.closest('form[data-role="edit-form"]');
    var addCardForm = e.target.closest('form[data-role="add-card-form"]');
    var editCardForm = e.target.closest('form[data-role="edit-card-form"]');
    var budgetForm = e.target.closest('form[data-role="budget-form"]');
    if (!addForm && !editForm && !addCardForm && !editCardForm && !budgetForm) return;
    e.preventDefault();

    if (budgetForm) {
      var budgetAmount = parseFloat(budgetForm.elements["budget"].value);
      if (isNaN(budgetAmount) || budgetAmount <= 0) return;
      editingBudgetCat = null;
      setBudget(budgetForm.getAttribute("data-cat"), budgetAmount);
      return;
    }

    if (addCardForm || editCardForm) {
      var cardForm = addCardForm || editCardForm;
      var cardName = cardForm.elements["name"].value.trim();
      var cardBalance = parseFloat(cardForm.elements["balance"].value);
      var cardMinPayment = parseFloat(cardForm.elements["minPayment"].value);
      var cardAutopay = !!cardForm.elements["autopay"].checked;
      if (!cardName || isNaN(cardBalance) || cardBalance < 0 || isNaN(cardMinPayment) || cardMinPayment < 0) return;
      if (editCardForm) {
        var cardId = editCardForm.getAttribute("data-id");
        editingCardId = null;
        editCreditCard(openCategory.cat, cardId, { name: cardName, balance: cardBalance, minPayment: cardMinPayment, autopay: cardAutopay });
      } else {
        addingCard = false;
        addCreditCard(openCategory.cat, { name: cardName, balance: cardBalance, minPayment: cardMinPayment, autopay: cardAutopay });
      }
      return;
    }

    if (editForm) {
      var editLedgerKey = editForm.getAttribute("data-ledger");
      var editCat = editForm.getAttribute("data-cat");
      var editId = editForm.getAttribute("data-id");
      var editDate = editForm.elements["date"].value;
      var editDescription = editForm.elements["description"].value.trim();
      var editAmount = parseFloat(editForm.elements["amount"].value);
      if (!editDescription || !editAmount || editAmount <= 0) return;
      editingEntry = null;
      editEntry(editLedgerKey, editCat, editId, { date: editDate, description: editDescription, amount: editAmount });
      return;
    }

    var ledgerKey = addForm.getAttribute("data-ledger");
    var cat = addForm.getAttribute("data-cat");
    var date = addForm.elements["date"].value;
    var description = addForm.elements["description"].value.trim();
    var amount = parseFloat(addForm.elements["amount"].value);
    if (!description || !amount || amount <= 0) return;
    var recurringEl = addForm.elements["recurring"];
    var recurring = !!(recurringEl && recurringEl.checked);
    addingCategory = null;
    addEntry(ledgerKey, cat, { date: date, description: description, amount: amount, recurring: recurring });
  });

  document.querySelector('[data-action="open-audit"]').addEventListener("click", openAudit);
  document.querySelector('[data-action="open-report"]').addEventListener("click", openReport);
  reportOverlayEl.addEventListener("click", function (e) {
    if (e.target === reportOverlayEl || e.target.closest('[data-action="close-report"]')) { closeReport(); return; }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "report-goto") {
      goToMonthOf(el.getAttribute("data-date"));
      closeReport();
      render();
      materializeRecurring();
      return;
    }
    if (action === "report-tab") reportTab = el.getAttribute("data-tab");
    else if (action === "report-months") reportMonths = Number(el.getAttribute("data-n")) === 6 ? 6 : 12;
    else if (action === "report-table") reportTable = !reportTable;
    else return;
    reportTipEl.hidden = true;
    renderReport();
  });
  reportOverlayEl.addEventListener("change", function (e) {
    var act = e.target.getAttribute("data-action");
    if (act === "report-cat") { reportCat = e.target.value; renderReport(); }
    else if (act === "search-cat") { searchCat = e.target.value; updateSearchResults(); }
  });
  reportOverlayEl.addEventListener("input", function (e) {
    if (e.target.getAttribute("data-action") !== "search-text") return;
    searchText = e.target.value;
    updateSearchResults();
  });
  reportOverlayEl.addEventListener("pointermove", function (e) {
    var hit = e.target.closest && e.target.closest(".hit");
    if (hit) showReportTip(hit, e); else reportTipEl.hidden = true;
  });
  reportOverlayEl.addEventListener("pointerleave", function () { reportTipEl.hidden = true; });
  reportOverlayEl.addEventListener("focusin", function (e) {
    if (e.target.classList && e.target.classList.contains("hit")) showReportTip(e.target, e);
  });
  reportOverlayEl.addEventListener("focusout", function () { reportTipEl.hidden = true; });
  window.addEventListener("resize", function () { if (reportOpen && reportTab === "trends" && !reportTable) renderReport(); });
  auditOverlayEl.addEventListener("click", function (e) {
    if (e.target === auditOverlayEl || e.target.closest('[data-action="close-audit"]')) closeAudit();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && auditOpen) closeAudit();
    if (e.key === "Escape" && reportOpen) closeReport();
  });

  function init() {
    state.data = loadLocalCache();
    state.loaded = true;
    render();
    materializeRecurring();

    var wantsDrive = localStorage.getItem(LS_MODE_KEY) === "drive" && drive.fileId;
    if (wantsDrive) {
      // try a silent reconnect once Google's script has loaded
      var tries = 0;
      var wait = setInterval(function () {
        tries += 1;
        if (window.google && google.accounts && google.accounts.oauth2) {
          clearInterval(wait);
          connectDrive(false).catch(function () {});
        } else if (tries > 40) {
          clearInterval(wait);
        }
      }, 100);
    }
  }

  init();

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
